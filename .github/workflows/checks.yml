name: Benchmark correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libnuma-dev
      - run: CHECK_NUMA=1 python -m unittest discover -s tests -v
      - run: bash -n benchmarks/scripts/build.sh benchmarks/scripts/run_benchmarks.sh
